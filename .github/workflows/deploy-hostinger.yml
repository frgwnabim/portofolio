# =============================================================================
# Build website lalu kirim hasilnya ke branch `deploy`
# -----------------------------------------------------------------------------
# Fitur Git bawaan Hostinger (hPanel > Advanced > GIT) hanya meng-clone repo,
# tidak menjalankan `npm run build`. Workflow ini yang melakukan build, lalu
# menaruh isi folder dist/ di root branch `deploy`.
#
# Di hPanel, arahkan auto deploy Git ke branch `deploy` (bukan `main`),
# sehingga yang masuk ke public_html adalah website jadi (ada index.html).
#
# Tidak perlu secret apa pun, cukup token bawaan GitHub Actions.
# =============================================================================
name: Deploy ke Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependency
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Push hasil build ke branch deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: deploy
          # Branch deploy selalu berisi 1 commit terbaru saja, supaya ringan
          force_orphan: true
          # Jangan tambahkan file .nojekyll (khusus GitHub Pages, tidak perlu di Hostinger)
          enable_jekyll: true
          commit_message: 'Deploy dari ${{ github.sha }}'
